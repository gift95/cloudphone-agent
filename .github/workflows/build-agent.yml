name: Build Agent and APK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release with artifacts'
        required: true
        default: 'false'
  push:
    branches: [ main ]
    paths:
      - 'agent/**'
      - 'scrcpy-server/**'
      - 'android/**'
      - '.github/workflows/build-agent.yml'
      - '.github/magisk/**'
      - 'deploy/**'
    tags:
      - 'v*'

env:
  GO_VERSION: '1.22'
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  OUTPUT_DIR: build

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-${{ env.ANDROID_COMPILE_SDK }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}"

      # ============================================================
      # Phase 1: Build scrcpy-server (libsys_core.so)
      # ============================================================
      - name: Build scrcpy-server (libsys_core.so)
        working-directory: scrcpy-server/android
        env:
          ANDROID_PLATFORM: ${{ env.ANDROID_COMPILE_SDK }}
          ANDROID_BUILD_TOOLS: ${{ env.ANDROID_BUILD_TOOLS }}
          BUILD_DIR: ${{ github.workspace }}/scrcpy-server/build
        run: |
          echo "=== Building scrcpy-server ==="
          chmod +x build_without_gradle.sh
          ./build_without_gradle.sh
          if [ ! -f "$BUILD_DIR/scrcpy-server" ]; then
            echo "ERROR: scrcpy-server not found!"
            exit 1
          fi
          cp "$BUILD_DIR/scrcpy-server" ${{ github.workspace }}/agent/libsys_core.so
          mkdir -p ${{ github.workspace }}/${{ env.OUTPUT_DIR }}
          cp "$BUILD_DIR/scrcpy-server" ${{ github.workspace }}/${{ env.OUTPUT_DIR }}/libsys_core.so
          echo "✅ scrcpy-server built, libsys_core.so ready"

      # ============================================================
      # Phase 2: Build Agent binaries (3 architectures)
      # ============================================================
      - name: Build Agent (arm64)
        working-directory: agent
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME}" -o ../${{ env.OUTPUT_DIR }}/cloudphone-agent-arm64 .
          echo "✅ arm64 build complete"

      - name: Build Agent (amd64)
        working-directory: agent
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME}" -o ../${{ env.OUTPUT_DIR }}/cloudphone-agent-amd64 .
          echo "✅ amd64 build complete"

      - name: Build Agent (armeabi-v7a)
        working-directory: agent
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME}" -o ../${{ env.OUTPUT_DIR }}/cloudphone-agent-armeabi-v7a .
          echo "✅ armeabi-v7a build complete"

      # ============================================================
      # Phase 3: Copy agent binaries into APK assets
      # ============================================================
      - name: Prepare agent binaries for APK
        run: |
          echo "=== Copying agent binaries to APK assets ==="
          mkdir -p android/app/src/main/assets/agent/arm64
          mkdir -p android/app/src/main/assets/agent/armeabi-v7a
          mkdir -p android/app/src/main/assets/agent/amd64

          cp ${{ env.OUTPUT_DIR }}/cloudphone-agent-arm64 android/app/src/main/assets/agent/arm64/cloudphone-agent
          cp ${{ env.OUTPUT_DIR }}/cloudphone-agent-armeabi-v7a android/app/src/main/assets/agent/armeabi-v7a/cloudphone-agent
          cp ${{ env.OUTPUT_DIR }}/cloudphone-agent-amd64 android/app/src/main/assets/agent/amd64/cloudphone-agent
          cp ${{ env.OUTPUT_DIR }}/libsys_core.so android/app/src/main/assets/libsys_core.so

          echo "=== APK assets ==="
          find android/app/src/main/assets -type f -exec ls -lh {} \;

      # ============================================================
      # Phase 4: Build APK (debug + release)
      # ============================================================
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Write signing config from secrets
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
            printf 'storeFile=keystore/release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "::notice::release signing configured from secrets"
          else
            echo "::warning::KEYSTORE_BASE64 secret not configured, release will use debug signing"
          fi

      - name: Build debug & release APKs
        working-directory: android
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${RELEASE_TAG#v}"
            VERSION_MAJOR=$(echo "$VERSION_NAME" | cut -d. -f1)
            VERSION_MINOR=$(echo "$VERSION_NAME" | cut -d. -f2)
            VERSION_PATCH=$(echo "$VERSION_NAME" | cut -d. -f3)
            VERSION_CODE=$((VERSION_MAJOR * 10000 + VERSION_MINOR * 100 + VERSION_PATCH))
            echo "Version: $VERSION_NAME (code $VERSION_CODE)"
            ./gradlew assembleDebug assembleRelease --no-daemon \
              -PversionName="$VERSION_NAME" \
              -PversionCode="$VERSION_CODE"
          else
            ./gradlew assembleDebug assembleRelease --no-daemon
          fi
          echo "Generated APKs:"
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      # ============================================================
      # Phase 5: Package agent-deploy.pkg + magisk.pkg
      # ============================================================
      - name: Package agent-deploy.pkg
        working-directory: ${{ env.OUTPUT_DIR }}
        run: |
          zip -j agent-deploy.pkg \
            cloudphone-agent-arm64 \
            cloudphone-agent-amd64 \
            cloudphone-agent-armeabi-v7a \
            libsys_core.so \
            ../deploy/run.bat \
            ../deploy/run.sh
          echo "✅ agent-deploy.pkg packaged"
          unzip -l agent-deploy.pkg

      - name: Package cloudphone-agent-magisk.pkg
        run: |
          rm -rf /tmp/magisk-pkg
          mkdir -p /tmp/magisk-pkg/binaries
          cp .github/magisk/module.prop /tmp/magisk-pkg/
          cp .github/magisk/config.conf /tmp/magisk-pkg/
          cp .github/magisk/service.sh /tmp/magisk-pkg/
          cp .github/magisk/customize.sh /tmp/magisk-pkg/
          cp .github/magisk/uninstall.sh /tmp/magisk-pkg/
          cp .github/magisk/action.sh /tmp/magisk-pkg/
          cp .github/magisk/cloudphone-ctl /tmp/magisk-pkg/
          chmod +x /tmp/magisk-pkg/service.sh
          chmod +x /tmp/magisk-pkg/customize.sh
          chmod +x /tmp/magisk-pkg/uninstall.sh
          chmod +x /tmp/magisk-pkg/action.sh
          chmod +x /tmp/magisk-pkg/cloudphone-ctl
          cp ${{ env.OUTPUT_DIR }}/cloudphone-agent-arm64 /tmp/magisk-pkg/binaries/
          cp ${{ env.OUTPUT_DIR }}/cloudphone-agent-amd64 /tmp/magisk-pkg/binaries/
          cp ${{ env.OUTPUT_DIR }}/cloudphone-agent-armeabi-v7a /tmp/magisk-pkg/binaries/
          cp ${{ env.OUTPUT_DIR }}/libsys_core.so /tmp/magisk-pkg/
          cd /tmp/magisk-pkg
          zip -r ${{ github.workspace }}/${{ env.OUTPUT_DIR }}/cloudphone-agent-magisk.pkg .
          cd ${{ github.workspace }}
          echo "✅ magisk package packaged"
          unzip -l ${{ env.OUTPUT_DIR }}/cloudphone-agent-magisk.pkg

      # ============================================================
      # Phase 6: Upload all artifacts
      # ============================================================
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudphone-agent-release
          path: |
            ${{ env.OUTPUT_DIR }}/agent-deploy.pkg
            ${{ env.OUTPUT_DIR }}/cloudphone-agent-magisk.pkg
            ${{ env.OUTPUT_DIR }}/cloudphone-agent-arm64
            ${{ env.OUTPUT_DIR }}/cloudphone-agent-amd64
            ${{ env.OUTPUT_DIR }}/cloudphone-agent-armeabi-v7a
            ${{ env.OUTPUT_DIR }}/libsys_core.so
            android/app/build/outputs/apk/debug/cloudphone-agent-*.apk
            android/app/build/outputs/apk/release/cloudphone-agent-*.apk
          retention-days: 30

      # ============================================================
      # Phase 7: Create GitHub Release (tag v*)
      # ============================================================
      - name: Create GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "CloudPhone Agent ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            ${{ env.OUTPUT_DIR }}/agent-deploy.pkg
            ${{ env.OUTPUT_DIR }}/cloudphone-agent-magisk.pkg
            ${{ env.OUTPUT_DIR }}/cloudphone-agent-arm64
            ${{ env.OUTPUT_DIR }}/cloudphone-agent-amd64
            ${{ env.OUTPUT_DIR }}/cloudphone-agent-armeabi-v7a
            ${{ env.OUTPUT_DIR }}/libsys_core.so
            android/app/build/outputs/apk/release/cloudphone-agent-*.apk
            android/app/build/outputs/apk/debug/cloudphone-agent-*.apk
