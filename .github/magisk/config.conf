# Cloudphone Agent Configuration (Replica Edition)

# 是否自启动
ENABLED=true

# 填入信令服务地址（-signaling），必填
# 支持域名或 IP（例如：ws://192.168.1.5:8443 或 wss://cloudphone.example.com:8443）
# https 服务对应 wss://，http 服务对应 ws://
CP_AGENT_SIGNALING="ws://192.168.50.100:8443/register_agent"

# 填入中转服务器地址（-ice-servers），空则只能局域网直连
CP_AGENT_ICE_SERVERS=""

# 自定义设备ID，空则使用默认设备ID
CP_AGENT_ID=""

# 视频码率（bps），默认 2000000
CP_AGENT_BITRATE="2000000"

# 最大视频尺寸，0=不限
CP_AGENT_MAX_SIZE=""

# 最大帧率，0=不限
CP_AGENT_MAX_FPS=""

# 视频分辨率 WxH，如 1920x1080
CP_AGENT_RESOLUTION=""

# 启用音频（true/false）
CP_AGENT_AUDIO="true"

# 启用调试日志（true/false）
CP_AGENT_DEBUG="true"

# 日志时区，如 Asia/Shanghai、UTC
CP_AGENT_TIMEZONE="Asia/Shanghai"
